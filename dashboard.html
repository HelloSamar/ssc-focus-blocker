<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>FocusGuard - Blocked</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0f172a;
      font-family: "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: grid;
      place-items: center;
      color: #ffffff;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 32px;
      text-align: center;
    }

    .status-tag {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #ef4444;
      font-size: 11px;
      font-weight: 800;
      padding: 6px 18px;
      border-radius: 100px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .dot-red {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 6px rgba(239,68,68,0.6);
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.8); }
    }

    .icon {
      width: 80px;
      height: 80px;
    }

    .name {
      font-size: 36px;
      font-weight: 900;
      line-height: 1;
    }

    .name span { color: #4ade80; }

    .message {
      max-width: 360px;
      font-size: 15px;
      line-height: 1.5;
      color: #cbd5e1;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      min-width: 116px;
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
    }

    .btn-primary {
      background: #16a34a;
      color: #ffffff;
    }

    .btn-secondary {
      background: #ffffff;
      color: #0f172a;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="status-tag">
      <div class="dot-red"></div>
      Access blocked
    </div>

    <img class="icon" src="icon128.png" alt="FocusGuard"/>

    <div class="name">Focus<span>Guard</span></div>
    <div class="message" id="blockedLabel">This site is on your blocklist.</div>
    <div class="actions">
      <button class="btn btn-secondary" id="goBack" type="button">Go Back</button>
      <button class="btn btn-primary" id="openList" type="button">Open Blocklist</button>
    </div>
  </div>
  <script src="dashboard.js"></script>
</body>
</html>
